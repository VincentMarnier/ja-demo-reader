name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and the OpenJK reference
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.1
          actions-cache-folder: emsdk-cache

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev

      - name: Build rd-rend2 engine
        timeout-minutes: 45
        env:
          BUILD_REND2: "1"
          BUILD_CGAME: "1"
          NO_PRELOAD: "1"
          WORK: ${{ runner.temp }}/rd-rend2/work
          BUILD: ${{ runner.temp }}/rd-rend2/build
          OUT: ${{ runner.temp }}/rd-rend2/out
        run: |
          engine/scripts/build-mp-wasm.sh
          scripts/stage-engine.sh "$OUT"
          test -s app/public/engine/openjk.x86.js
          test -s app/public/engine/openjk.x86.wasm

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
